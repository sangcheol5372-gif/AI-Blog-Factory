# ── 자치법규 (target=ordin) ──
[[ordinances]]
name = "군산시 도시계획 조례"
purpose = "자연녹지지역 건폐율·용적률, 개발행위허가 기준(경사도·입목본수 등)"

# ── 뉴스 검색 키워드 (Google News RSS) ──
# 뉴스는 '보도 내용'일 뿐 확정 사실이 아니다. 보고서에는 1차 출처(공시·보도자료)로 재확인된 것만 사실로 쓴다.
[news]
max_items_per_query = 30
queries = [
  "현대차 새만금 AI 데이터센터",
  "현대차 새만금 수소 로봇",
  "새만금 투자 협약 현대자동차",
  "군산 신관동",
  "군산 도시계획 변경 자연녹지",
  "군산 토지거래허가구역",
  "농지법 개정 2026",
  "농지 소유 규제 강화 비농업인",
  "새만금 개발 착공 2027",
]
