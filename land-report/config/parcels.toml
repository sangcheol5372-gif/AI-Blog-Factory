# 매각 대상 필지 (상속 후 양도 예정, 사용자 제공 상속재산 표의 노란색 행)
# 금액 단위: 원. 평가액은 사용자 제공 감정 범위이며, 수집 단계에서 공부(公簿) 자료로 교차검증한다.
#
# pnu: 19자리 필지고유번호. 비워두면 VWorld 주소검색으로 자동 조회한다.
# bjd_code: 10자리 법정동코드(군산시 신관동). 알면 적어두면 PNU를 바로 만든다.

[region]
sido = "전북특별자치도"
sigungu = "군산시"
dong = "신관동"
lawd_cd = "52130"   # 실거래가 API용 시군구코드(5자리). 2024.1 전북특별자치도 출범 후 45130→52130. 첫 실행 때 확인 필요.
bjd_code = ""       # 예: 52130xxxxx

